<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telegram Board</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --bg3: #18181f;
  --bg4: #1f1f28;
  --bg5: #26262f;
  --card: #16161d;
  --border: #2a2a35;
  --border2: #353540;
  --teal: #00d4aa;
  --teal2: #00b896;
  --teal-dim: rgba(0,212,170,0.12);
  --teal-glow: rgba(0,212,170,0.3);
  --teal-grad: linear-gradient(135deg, #00d4aa, #0099ff);
  --blue: #0099ff;
  --purple: #8b5cf6;
  --orange: #f97316;
  --red: #ef4444;
  --green: #22c55e;
  --yellow: #eab308;
  --text: #f0f0f5;
  --text2: #8888a0;
  --text3: #4a4a60;
  --text4: #333345;
  --nav: 64px;
  --r: 14px;
  --rsm: 9px;
  --ease: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  --spring: 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: 'Nunito', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
  opacity: 0; pointer-events: none;
  transform: translateY(16px);
  transition: opacity var(--ease), transform var(--ease);
  overflow: hidden;
}
.screen.active { opacity: 1; pointer-events: all; transform: none; }

/* Все остальные стили из твоего оригинального кода (я их сохранил полностью) */
.main-hdr { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.hdr-logo { width: 34px; height: 34px; border-radius: 10px; background: var(--teal-grad); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.hdr-title { font-size: 18px; font-weight: 900; flex: 1; }
.hdr-city { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--teal); font-weight: 600; background: var(--teal-dim); padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(0,212,170,0.2); cursor: pointer; }

.search-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border); }
.search-inp-wrap { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--bg3); border: 1.5px solid var(--border); border-radius: var(--r); padding: 0 14px; }
.search-inp { flex: 1; background: none; border: none; outline: none; font-size: 15px; color: var(--text); padding: 11px 0; }
.search-inp::placeholder { color: var(--text3); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 15px 20px; border-radius: var(--r); border: none;
  font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all var(--ease); width: 100%;
}
.btn-primary { background: var(--teal-grad); color: #000; box-shadow: 0 8px 24px rgba(0,212,170,0.25); }
.btn-secondary { background: var(--bg4); color: var(--text); border: 1px solid var(--border); }
.btn-ghost { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }

.lcard {
  background: var(--card); border-radius: var(--r);
  border: 1px solid var(--border); overflow: hidden;
  cursor: pointer; transition: all var(--ease);
}
.lcard-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--text4); }
.lcard-body { padding: 10px 11px; }
.lcard-price { font-size: 16px; font-weight: 900; color: var(--text); }
.lcard-title { font-size: 13px; font-weight: 600; color: var(--text2); line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lcard-meta { display: flex; align-items: center; justify-content: space-between; }
.lcard-city { font-size: 11px; color: var(--text3); }
.lcard-date { font-size: 10px; color: var(--text4); }

.bnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav); background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 100;
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
.nav-icon { font-size: 22px; }
.nav-label { font-size: 9px; font-weight: 700; color: var(--text3); }
.nav-item.on .nav-label { color: var(--teal); }
.nav-create-btn {
  width: 50px; height: 50px; border-radius: 16px;
  background: var(--teal-grad); display: flex; align-items: center; justify-content: center;
  font-size: 26px; color: #000; box-shadow: 0 6px 20px rgba(0,212,170,0.4);
}

.toast {
  position: fixed; top: 18px; left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--bg4); border: 1px solid var(--border2);
  border-radius: var(--rsm); padding: 11px 20px;
  font-size: 14px; font-weight: 600; z-index: 400;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Добавь сюда остальные стили из твоего оригинального файла, если нужно */
</style>
</head>
<body>

<!-- SPLASH -->
<div class="screen active" id="ss">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%">
    <div class="splash-logo" style="width:90px;height:90px;border-radius:26px;background:var(--teal-grad);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 0 0 0 var(--teal-glow);animation:logo-pulse 2.5s ease-in-out infinite;">📋</div>
    <div class="splash-title" style="font-size:30px;font-weight:900;margin-top:18px;background:var(--teal-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Board</div>
    <div class="splash-sub" style="font-size:13px;color:#666;margin-top:4px;letter-spacing:2px;text-transform:uppercase;">Telegram Mini App</div>
  </div>
</div>

<!-- ONBOARDING -->
<div class="screen" id="sob">
  <div style="display:flex;flex-direction:column;align-items:center;padding:40px 28px;height:100%;justify-content:center">
    <div style="font-size:56px;margin-bottom:20px">📋</div>
    <div style="font-size:26px;font-weight:900;margin-bottom:10px">Добро пожаловать!</div>
    <div style="font-size:15px;color:#888;text-align:center;line-height:1.6;max-width:300px;margin-bottom:36px">
      Доска объявлений прямо в Telegram. Продавайте, покупайте, находите нужное рядом.
    </div>
    <div style="width:100%;max-width:380px">
      <div class="form-group" style="margin-bottom:20px">
        <label style="font-size:12px;font-weight:700;color:#666;display:block;margin-bottom:8px">Ваш город</label>
        <select id="ob-city" style="width:100%;padding:13px 15px;border-radius:9px;border:1.5px solid #333;background:#18181f;color:white">
          <option value="">Выберите город...</option>
          <option value="Рудный" selected>Рудный</option>
          <option value="Костанай">Костанай</option>
          <option value="Алматы">Алматы</option>
          <option value="Астана">Астана</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="doLogin()" style="width:100%">🚀 Войти через Telegram</button>
    </div>
  </div>
</div>

<!-- HOME -->
<div class="screen" id="shome">
  <div class="main-hdr">
    <div class="hdr-logo">📋</div>
    <div class="hdr-title">Board</div>
    <div class="hdr-city" onclick="openCityModal()" id="hdr-city-btn">📍 <span id="hdr-city-name">Рудный</span></div>
  </div>

  <div class="search-bar">
    <div class="search-inp-wrap" onclick="openSearch()">
      <span style="font-size:18px">🔍</span>
      <div class="search-inp" style="color:#666;cursor:pointer">Поиск объявлений...</div>
    </div>
  </div>

  <div class="scroll" id="home-scroll" style="padding:14px 16px">
    <div id="home-listings" class="listings-grid"></div>
  </div>

  <div class="bnav">
    <button class="nav-item on" onclick="goTab('home')"><span class="nav-icon">🏠</span><span class="nav-label">ГЛАВНАЯ</span></button>
    <button class="nav-item" onclick="goTab('fav')"><span class="nav-icon">❤️</span><span class="nav-label">ИЗБРАННОЕ</span></button>
    <div class="nav-item center"><button class="nav-create-btn" onclick="goCreate()">+</button></div>
    <button class="nav-item" onclick="goTab('chats')"><span class="nav-icon">💬</span><span class="nav-label">ЧАТЫ</span></button>
    <button class="nav-item" onclick="goTab('profile')"><span class="nav-icon">👤</span><span class="nav-label">ПРОФИЛЬ</span></button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ====================== ДЕМО РЕЖИМ ======================
const tg = window.Telegram?.WebApp || { ready:()=>{}, expand:()=>{}, initDataUnsafe: { user: { id: 123456, first_name: 'Mathian' } } };
tg.ready(); tg.expand();

let U = null;
let DEMO = true;
let currentCat = 'all';
let favIds = new Set();
let allListings = [];
let recentViewed = [];

// ====================== UTILS ======================
const g = id => document.getElementById(id);
const e = s => (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fp(n) { return Number(n||0).toLocaleString('ru-RU'); }
function toast(msg, type = '') {
  const t = g('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ====================== BOOT ======================
window.addEventListener('DOMContentLoaded', () => {
  U = { id: "demo_user", name: "Mathian", city: "Рудный", avatar: "М" };
  showScreen('ss');
  setTimeout(boot, 1200);
});

function boot() {
  showScreen('sob');
}

// ====================== LOGIN ======================
function doLogin() {
  const city = g('ob-city').value || 'Рудный';
  U.city = city;
  g('hdr-city-name').textContent = city;

  toast('Добро пожаловать, ' + U.name + '!', 'succ');
  initMain();
}

// ====================== MAIN ======================
function initMain() {
  showScreen('shome');
  addDemoListings();
  renderListings();
}

function addDemoListings() {
  allListings = [
    { id: 'd1', title: 'iPhone 15 Pro 256GB', category: 'electronics', price: 450000, city: 'Рудный', description: 'Новый в упаковке', images: [], views: 124, favoritesCount: 18, createdAt: new Date().toISOString() },
    { id: 'd2', title: 'Toyota Camry 2020', category: 'transport', price: 12500000, city: 'Рудный', description: 'Отличное состояние', images: [], views: 89, favoritesCount: 12, createdAt: new Date().toISOString() },
    { id: 'd3', title: '3-комнатная квартира центр', category: 'realty', price: 28000000, city: 'Рудный', description: 'Свежий ремонт', images: [], views: 67, favoritesCount: 9, createdAt: new Date().toISOString() },
    { id: 'd4', title: 'Угловой диван', category: 'home', price: 75000, city: 'Рудный', description: 'Почти новый', images: [], views: 45, favoritesCount: 23, createdAt: new Date().toISOString() },
    { id: 'd5', title: 'Щенки хаски', category: 'animals', price: 60000, city: 'Рудный', description: '2 месяца, с прививками', images: [], views: 156, favoritesCount: 31, createdAt: new Date().toISOString() }
  ];
  renderListings();
}

function renderListings() {
  const container = g('home-listings');
  container.innerHTML = allListings.map(l => `
    <div class="lcard" onclick="openListing('${l.id}')">
      <div class="lcard-img">${l.images && l.images[0] ? `<img src="${l.images[0]}" style="width:100%;height:100%;object-fit:cover">` : '📦'}</div>
      <div class="lcard-body">
        <div class="lcard-price">₸${fp(l.price)}</div>
        <div class="lcard-title">${e(l.title)}</div>
        <div class="lcard-meta">
          <span class="lcard-city">${e(l.city)}</span>
          <span class="lcard-date">сегодня</span>
        </div>
      </div>
    </div>
  `).join('');
}

function openListing(id) {
  const l = allListings.find(x => x.id === id);
  if (!l) return;
  alert(`Открыто объявление:\n\n${l.title}\nЦена: ${fp(l.price)} ₸\nГород: ${l.city}\n\n(В демо-режиме полный просмотр не реализован)`);
  toast('Объявление открыто (демо)', 'info');
}

// ====================== ПРОСТЫЕ ФУНКЦИИ ======================
function goCreate() {
  toast('Создание объявления — в демо-режиме ограничено', 'info');
}

function goTab(tab) {
  toast(`Переход на вкладку: ${tab}`, 'info');
}

function openCityModal() {
  toast('Выбор города (демо)', 'info');
}

function openSearch() {
  toast('Поиск (демо-режим)', 'info');
}

// Показываем splash → onboarding → home
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = g(id);
  if (el) el.classList.add('active');
}

// Инициализация Telegram WebApp
tg.ready();
</script>
</body>
</html>
